
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梵谷藝術作品</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f4f1e9;
}

.carousel img {
    width: 100%;
    height: 420px;
    object-fit: cover;
}

.gallery {
    margin-top: 35px;
    margin-bottom: 40px;
}

.card {
    border: none;
    overflow: hidden;
    background: transparent;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    transition: transform 0.3s;
}

.card img:hover {
    transform: scale(1.05);
}

/* 響應式欄位 */
.art-col {
    width: 100%;
}

@media (min-width: 576px) {
    .art-col {
        width: 50%;
    }
}

@media (min-width: 768px) {
    .art-col {
        width: 25%;
    }
}

@media (min-width: 1280px) {
    .art-col {
        width: 16.666667%;
    }
}

footer {
    background-color: #263b59;
    height: 60px;
}
</style>
</head>

<body>

<!-- 四張輪播圖片 -->
<div class="container mt-4">

<div id="artCarousel" class="carousel slide"
data-bs-ride="carousel">

<div class="carousel-indicators">
<button type="button" data-bs-target="#artCarousel" data-bs-slide-to="0" class="active"></button>
<button type="button" data-bs-target="#artCarousel" data-bs-slide-to="1"></button>
<button type="button" data-bs-target="#artCarousel" data-bs-slide-to="2"></button>
<button type="button" data-bs-target="#artCarousel" data-bs-slide-to="3"></button>
</div>

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Self-Portrait%20-%20Google%20Art%20Project.jpg"
class="d-block w-100" alt="自畫像">
</div>

<div class="carousel-item">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Van%20Gogh%20-%20Starry%20Night%20-%20Google%20Art%20Project.jpg"
class="d-block w-100" alt="星夜">
</div>

<div class="carousel-item">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Sunflowers%20-%20VGM%20F458.jpg"
class="d-block w-100" alt="向日葵">
</div>

<div class="carousel-item">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh%2C_Wheatfield_with_crows.jpg"
class="d-block w-100" alt="麥田群鴉">
</div>

</div>

<button class="carousel-control-prev"
type="button" data-bs-target="#artCarousel"
data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next"
type="button" data-bs-target="#artCarousel"
data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>
</div>

<!-- 十二張圖片卡片 -->
<div class="container gallery">
<div class="row g-4">

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Van%20Gogh%20-%20Starry%20Night%20-%20Google%20Art%20Project.jpg" alt="星夜">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Sunflowers%20-%20VGM%20F458.jpg" alt="向日葵">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Self-Portrait%20-%20Google%20Art%20Project.jpg" alt="自畫像">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Wheatfield%20with%20Crows%20-%20Google%20Art%20Project.jpg" alt="麥田群鴉">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_The_Bedroom_-_Google_Art_Project.jpg" alt="臥室">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="	https://commons.wikimedia.org/wiki/Special:FilePath/VanGoghIrises.jpg" alt="鳶尾花">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent-van-gogh-cafe-terrace-on-the-place-du-forum-arles-at-night-the.jpg" alt="夜晚咖啡座">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Almond%20blossom%20-%20Google%20Art%20Project.jpg" alt="杏花">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/The_Potato_Eaters_-_Vincent_Van_Gogh.jpg" alt="吃馬鈴薯的人">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Van-gogh_church.jpg" alt="奧維教堂">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Roses%20-%20Google%20Art%20Project.jpg" alt="玫瑰">
</div>
</div>

<div class="art-col">
<div class="card">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_The_yellow_house_%28%60The_street%27%29_-_Google_Art_Project.jpg" alt="黃屋">
</div>
</div>

</div>
</div>

<footer></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
